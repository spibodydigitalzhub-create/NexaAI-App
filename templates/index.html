<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spibody AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --surface: #ffffff;
    --surface-2: #f1f5f9; --border: #e2e8f0; --text: #0f172a; --text-muted: #64748b;
    --text-light: #94a3b8; --shadow: 0 4px 12px rgba(0,0,0,0.08);
}
html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
body { display: flex; flex-direction: column; }

.header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); z-index: 10; }
.header-title { font-weight: 700; font-size: 1.1rem; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.action-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
.action-btn:hover { background: rgba(255,255,255,0.3); }

.chat-container { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; flex: 1; }
.welcome h1 { font-size: 1.6rem; margin-bottom: 8px; }
.welcome p { color: var(--text-muted); max-width: 320px; }

.message { display: flex; gap: 12px; max-width: 100%; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.message.user { flex-direction: row-reverse; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; }
.avatar.bot { background: transparent; }
.avatar.bot img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

.bubble { max-width: 90%; padding: 18px 22px; border-radius: 20px; font-size: 1.05rem; line-height: 1.8; word-wrap: break-word; }
.message.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
.message.bot .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
.bubble p { margin-bottom: 14px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble strong { font-weight: 700; }
.bubble code { background: rgba(0,0,0,0.08); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
.message.user .bubble code { background: rgba(255,255,255,0.2); }
.bubble pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 12px; overflow-x: auto; margin: 14px 0; font-family: monospace; white-space: pre-wrap; }

.timestamp { font-size: 0.7rem; color: var(--text-light); margin-top: 6px; padding: 0 4px; }
.message.user .timestamp { text-align: right; }

.typing { display: flex; gap: 4px; padding: 4px 0; }
.typing span { width: 8px; height: 8px; background: var(--text-light); border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

.input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 16px; display: flex; gap: 12px; align-items: flex-end; }
.input-wrapper { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 24px; padding: 10px 16px; display: flex; align-items: flex-end; }
textarea { flex: 1; border: none; background: transparent; resize: none; outline: none; font-family: inherit; font-size: 1.05rem; min-height: 60px; max-height: 200px; line-height: 1.5; color: var(--text); }
.send-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.send-btn:disabled { opacity: 0.5; }
.upload-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }

.error-banner { background: #fee2e2; color: #991b1b; padding: 14px; border-radius: 12px; text-align: center; margin: 10px 16px; display: none; }
.image-preview { position: absolute; bottom: 80px; left: 16px; background: white; padding: 8px; border-radius: 12px; box-shadow: var(--shadow); display: none; }
.image-preview img { max-height: 100px; border-radius: 8px; }
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Spibody AI</div>
    <div class="header-actions">
        <button class="action-btn" onclick="newChat()">New Chat</button>
        <button class="action-btn" onclick="clearChat()">Clear</button>
    </div>
</div>

<div class="chat-container" id="chatBox">
    <div class="welcome" id="welcome">
        <h1>Welcome to Spibody AI</h1>
        <p>Your personal, 100% unrestricted AI assistant.</p>
    </div>
</div>

<div id="errorBanner" class="error-banner"></div>

<div class="input-area" style="position: relative;">
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(event)">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+</button>
    <div class="image-preview" id="imgPreview">
        <img id="previewImg" src="">
    </div>
    <div class="input-wrapper">
        <textarea id="userInput" placeholder="Command Spibody AI..." oninput="this.style.height='auto'; this.style.height=Math.min(this.scrollHeight, 200)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="send()">></button>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');
const errorBanner = document.getElementById('errorBanner');
const imgPreview = document.getElementById('imgPreview');
const previewImg = document.getElementById('previewImg');

let isProcessing = false;
let chatHistory = [];
let currentImage = null;

function loadHistory() {
    try {
        const saved = localStorage.getItem('spibody_history');
        if (saved) {
            chatHistory = JSON.parse(saved);
            if (chatHistory.length > 0) {
                welcome.style.display = 'none';
                chatHistory.forEach(msg => addMessageToScreen(msg.content, msg.role === 'user', msg.isImage || false));
            }
        }
    } catch(e) {
        console.error("Failed to load history", e);
    }
}

function addMessageToScreen(text, isUser, isHtml = false) {
    welcome.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = 'message ' + (isUser ? 'user' : 'bot');
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (isUser ? 'user' : 'bot');
    avatar.innerHTML = isUser ? 'U' : '<img src="https://i.imgur.com/J3zYDId.jpeg">';
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = isHtml ? text : formatText(text);
    
    const time = document.createElement('div');
    time.className = 'timestamp';
    time.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    
    msg.appendChild(avatar);
    const content = document.createElement('div');
    content.style.flex = '1';
    content.appendChild(bubble);
    content.appendChild(time);
    msg.appendChild(content);
    
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function formatText(text) {
    if (!text) return '';
    let html = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/`(.*?)`/g, '<code>$1</code>');
    return html;
}

function handleFile(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            currentImage = e.target.result;
            previewImg.src = currentImage;
            imgPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

// NEW CHAT - Starts fresh but keeps old history in memory
function newChat() {
    if (chatHistory.length === 0) return;
    if (confirm('Start a new chat? Current conversation will be saved.')) {
        chatHistory = [];
        localStorage.removeItem('spibody_history');
        chatBox.innerHTML = '';
        chatBox.appendChild(welcome);
        welcome.style.display = 'flex';
        errorBanner.style.display = 'none';
    }
}

// CLEAR - Completely wipes everything
function clearChat() {
    if(confirm('Delete ALL history permanently?')) {
        chatHistory = [];
        localStorage.removeItem('spibody_history');
        chatBox.innerHTML = '';
        chatBox.appendChild(welcome);
        welcome.style.display = 'flex';
    }
}

async function send() {
    const text = userInput.value.trim();
    if ((!text && !currentImage) || isProcessing) return;

    isProcessing = true;
    sendBtn.disabled = true;
    sendBtn.textContent = '...';
    errorBanner.style.display = 'none';

    try {
        const hasImage = !!currentImage;
        const displayText = text || '[Image uploaded]';
        
        addMessageToScreen(displayText, true, false);
        chatHistory.push({role: 'user', content: displayText, isImage: hasImage});
        localStorage.setItem('spibody_history', JSON.stringify(chatHistory));
        
        userInput.value = '';
        userInput.style.height = 'auto';
        imgPreview.style.display = 'none';
        const imageToSend = currentImage;
        currentImage = null;

        const typingMsg = document.createElement('div');
        typingMsg.className = 'message bot';
        typingMsg.id = 'typing';
        typingMsg.innerHTML = '<div class="avatar bot"><img src="https://i.imgur.com/J3zYDId.jpeg"></div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
        chatBox.appendChild(typingMsg);
        chatBox.scrollTop = chatBox.scrollHeight;

        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text, history: chatHistory, image: imageToSend})
        });

        // Check if response is JSON
        const contentType = res.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
            const text = await res.text();
            throw new Error('Server returned HTML instead of JSON. Check backend.');
        }

        const data = await res.json();
        typingMsg.remove();

        if (data.error) throw new Error(data.error);

        addMessageToScreen(data.reply, false, data.is_image || false);
        chatHistory.push({role: 'assistant', content: data.reply, isImage: data.is_image || false});
        
        if (chatHistory.length > 30) {
            chatHistory = chatHistory.slice(-30);
        }
        localStorage.setItem('spibody_history', JSON.stringify(chatHistory));

    } catch (err) {
        const typing = document.getElementById('typing');
        if (typing) typing.remove();
        errorBanner.textContent = 'Error: ' + err.message;
        errorBanner.style.display = 'block';
        setTimeout(() => errorBanner.style.display = 'none', 10000);
        
        if (chatHistory.length > 0 && chatHistory[chatHistory.length-1].role === 'user') {
            chatHistory.pop();
            localStorage.setItem('spibody_history', JSON.stringify(chatHistory));
        }
    } finally {
        isProcessing = false;
        sendBtn.disabled = false;
        sendBtn.textContent = '>';
        userInput.focus();
    }
}

loadHistory();
userInput.focus();
</script>
</body>
</html>
